# Hooks run the project's own pinned tools via uv, so local and CI versions never drift.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: import-linter
        name: architecture contracts
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        files: ^backend/src/.*\.py$
        pass_filenames: false
      - id: frontend-lint
        name: frontend eslint
        entry: bash -c 'cd frontend && npm run -s lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
        pass_filenames: false
      - id: frontend-format
        name: frontend prettier
        entry: bash -c 'cd frontend && npx prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend tsc
        entry: bash -c 'cd frontend && npm run -s typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
