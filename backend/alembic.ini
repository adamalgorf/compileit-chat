# For `uv run alembic ...` during development (e.g. `alembic revision --autogenerate -m "..."`).
# The URL comes from DATABASE_URL; the app itself migrates on startup (Database.upgrade).
[alembic]
script_location = src/compileit_chat/infrastructure/persistence/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %%(levelname)s %%(name)s: %%(message)s
