[project]
name = "compileit-chat"
version = "0.1.0"
description = "Swedish Q&A chat over compileit.com: a LangGraph agent behind a Clean Architecture core."
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.3",
    "snowballstemmer>=3.1.1",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
compileit-chat = "compileit_chat.interface.cli.main:app"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compileit_chat"]

# --- Lint & format ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "TC",       # type-checking imports
]

ignore = [
    "SIM905",   # """word list""".split() is more readable than a long list literal
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# --- Types -----------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["compileit_chat"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "snowballstemmer"]  # ship without type information
ignore_missing_imports = true

# --- Tests -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["eval: hits real OpenAI APIs; excluded from CI (run with `make eval`)"]

# --- Architecture (dependency rule enforced in CI) -------------------------

[tool.importlinter]
root_package = "compileit_chat"
include_external_packages = true

# Entry points in `interface` obtain use cases from the composition root (`container`), which
# is the only module that knows the adapters.
[[tool.importlinter.contracts]]
name = "Layers: dependencies point inward only"
type = "layers"
layers = [
    "compileit_chat.interface",
    "compileit_chat.container",
    "compileit_chat.config",
    "compileit_chat.infrastructure",
    "compileit_chat.application",
    "compileit_chat.domain",
]

[[tool.importlinter.contracts]]
name = "Interface never touches adapters directly"
type = "forbidden"
source_modules = ["compileit_chat.interface"]
forbidden_modules = ["compileit_chat.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Adapters are configured with plain values, never with Settings"
type = "forbidden"
source_modules = ["compileit_chat.infrastructure"]
forbidden_modules = ["compileit_chat.config"]

[[tool.importlinter.contracts]]
name = "Core (domain + application) is framework-free"
type = "forbidden"
source_modules = ["compileit_chat.domain", "compileit_chat.application"]
forbidden_modules = [
    "chromadb",
    "fastapi",
    "httpx",
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langgraph",
    "openai",
    "pydantic",
    "trafilatura",
    "typer",
]
